name: helm-validate
description: >
  PR-time validation for repos that supply a values.yaml to a remote Helm
  chart pinned in a DIFFERENT repo (this homelab's split-repo pattern:
  the chart version lives in an ArgoCD Application's sources[], the
  values.yaml lives here). Renders `helm template <chart> --version
  <pinned>` against this repo's values.yaml and fails on any schema
  violation -- catches "this value isn't valid for the chart version
  we're actually running" without anyone having to read the chart's
  changelog by hand. See README for the .chart-version + Renovate
  grouping convention this pairs with.

inputs:
  chart-repo:
    description: Helm chart repository URL (e.g. https://charts.jetstack.io).
    required: true
  chart-name:
    description: Chart name within that repository (e.g. cert-manager).
    required: true
  chart-version-file:
    description: >
      Path to a file containing just the pinned chart semver (no leading
      "v" unless the chart itself uses one -- match whatever the ArgoCD
      Application's targetRevision uses). Default .chart-version.
    default: .chart-version
  argocd-application:
    description: >
      Path of the ArgoCD Application in argocd-projects-repo that pins
      this chart (e.g. prometheus/prometheus.yaml). When set, the version
      is that source's targetRevision -- the pin that actually deploys --
      and chart-version-file is ignored (homelab#1443 option A). Leave
      unset to keep reading chart-version-file.
    default: ""
  github-token:
    description: >
      Token that can read argocd-projects-repo. Required with
      argocd-application when that repo is private.
    default: ""
  github-token-file:
    description: >
      Path to a file holding that token, instead of github-token (e.g.
      /etc/argocd-projects-token/token, mounted on the homelab
      <repo>-helm-runner sets). If an `expires_at` file sits beside it and
      is in the past, the action fails and says so rather than surfacing a
      bare 401.
    default: ""
  argocd-projects-repo:
    description: owner/name of the repo holding the ArgoCD Applications.
    default: dvystrcil/argocd-projects
  argocd-projects-ref:
    description: >
      Ref of argocd-projects-repo to read. main is what ArgoCD deploys.
    default: main
  values-file:
    description: Path to the values.yaml to validate.
    default: values.yaml
  helm-set:
    description: >
      Extra --set/--set-string args to pass to helm template, space-
      separated (e.g. for values that are only valid combined with a
      flag this repo doesn't itself set). Rarely needed.
    default: ""

runs:
  using: composite
  steps:
    - name: Install helm
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v helm >/dev/null; then
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        fi
        helm version --short

    - name: Read pinned chart version
      id: version
      shell: bash
      env:
        APP: ${{ inputs.argocd-application }}
        GH_TOKEN: ${{ inputs.github-token }}
        TOKEN_FILE: ${{ inputs.github-token-file }}
        PROJECTS_REPO: ${{ inputs.argocd-projects-repo }}
        PROJECTS_REF: ${{ inputs.argocd-projects-ref }}
        CHART: ${{ inputs.chart-name }}
        CHART_REPO: ${{ inputs.chart-repo }}
        VERSION_FILE: ${{ inputs.chart-version-file }}
        RESOLVER: ${{ github.action_path }}/resolve-chart-version.py
      run: |
        set -euo pipefail
        if [ -n "$APP" ]; then
          # The Application's targetRevision is the pin that deploys; a
          # .chart-version is a copy that can drift from it.
          python3 -c 'import yaml' 2>/dev/null || {
            echo "::error::argocd-application needs python3 with PyYAML (the homelab ARC runner image has it)"
            exit 1
          }
          if [ -n "${TOKEN_FILE:-}" ]; then
            # Read, never echo: the value goes straight into gh's env.
            [ -s "$TOKEN_FILE" ] || {
              echo "::error::github-token-file $TOKEN_FILE is missing or empty -- is the token Secret mounted and minted? (cluster-ops argocd-projects-token)"
              exit 1
            }
            exp_file="$(dirname "$TOKEN_FILE")/expires_at"
            if [ -s "$exp_file" ]; then
              exp=$(tr -d '[:space:]' < "$exp_file")
              if [ "$(date -u -d "$exp" +%s)" -le "$(date -u +%s)" ]; then
                echo "::error::token in $TOKEN_FILE expired at $exp -- the minter has stopped (cluster-ops argocd-projects-token)"
                exit 1
              fi
            fi
            GH_TOKEN=$(tr -d '[:space:]' < "$TOKEN_FILE")
            export GH_TOKEN
          fi
          [ -n "${GH_TOKEN:-}" ] || echo "::warning::no github-token: reading $PROJECTS_REPO anonymously (fails if private)"
          app="$RUNNER_TEMP/helm-validate-application.yaml"
          gh api "repos/$PROJECTS_REPO/contents/$APP?ref=$PROJECTS_REF" \
            -H "Accept: application/vnd.github.raw" > "$app" || {
            echo "::error::could not read $APP from $PROJECTS_REPO@$PROJECTS_REF"
            exit 1
          }
          v=$(python3 "$RESOLVER" "$app" "$CHART" "$CHART_REPO") || {
            echo "::error::no usable $CHART pin in $PROJECTS_REPO/$APP@$PROJECTS_REF (reason above)"
            exit 1
          }
          echo "Validating against chart version: $v ($PROJECTS_REPO/$APP@$PROJECTS_REF)"
        else
          [ -f "$VERSION_FILE" ] || {
            echo "::error::chart-version-file not found: $VERSION_FILE -- see README for the .chart-version convention"
            exit 1
          }
          v=$(tr -d '[:space:]' < "$VERSION_FILE")
          [ -n "$v" ] || { echo "::error::$VERSION_FILE is empty"; exit 1; }
          echo "Validating against chart version: $v ($VERSION_FILE)"
        fi
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Add chart repo
      shell: bash
      run: |
        set -euo pipefail
        helm repo add helm-validate-target "${{ inputs.chart-repo }}" --force-update
        helm repo update helm-validate-target

    - name: helm template (schema validation)
      shell: bash
      run: |
        set -euo pipefail
        [ -f "${{ inputs.values-file }}" ] || {
          echo "::error::values-file not found: ${{ inputs.values-file }}"
          exit 1
        }
        # helm template performs full values-schema validation against
        # the chart's values.schema.json (when the chart ships one --
        # jetstack's cert-manager chart does, since v1.19). A removed,
        # renamed, or type-changed key fails here with a clear message
        # naming the offending path -- no changelog-reading required.
        helm template test-release "helm-validate-target/${{ inputs.chart-name }}" \
          --version "${{ steps.version.outputs.version }}" \
          -f "${{ inputs.values-file }}" \
          ${{ inputs.helm-set }} \
          > /tmp/helm-validate-rendered.yaml
        echo "HELM-VALIDATE-COMPLETE"

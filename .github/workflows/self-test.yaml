name: Self-test

# Exercises the action against real cert-manager chart versions -- the
# exact case that motivated this action (dvystrcil/cert-manager#2,
# homelab#816). Two fixtures: one with the 3 keys cert-manager v1.21.0
# removed (must fail), one without (must pass). Uses the action's own
# steps directly rather than `uses: ./` against itself, since actions
# can't invoke themselves as a composite step within their own repo in
# a way that exercises `action.yml`'s real input-resolution path --
# this runs the same commands `action.yml` runs, asserting each outcome.

on:
  pull_request:
    paths:
      - 'action.yml'
      - 'resolve-chart-version.py'
      - 'check-values-landing.py'
      - 'tests/**'
      - '.github/workflows/self-test.yaml'
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'resolve-chart-version.py'
      - 'check-values-landing.py'
      - 'tests/**'
      - '.github/workflows/self-test.yaml'

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install helm
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version --short

      - name: Add jetstack chart repo
        run: |
          set -euo pipefail
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm repo update jetstack

      - name: "Fixture — removed keys present must fail"
        run: |
          set -euo pipefail
          cat > /tmp/bad-values.yaml <<'EOF'
          prometheus:
            enabled: true
            servicemonitor:
              enabled: false
              targetPort: 9402
              path: /metrics
          EOF
          if helm template test jetstack/cert-manager --version v1.21.1 -f /tmp/bad-values.yaml > /tmp/out.yaml 2>/tmp/err.txt; then
            echo "::error::expected helm template to fail on removed keys, it succeeded"
            exit 1
          fi
          grep -q "additional properties" /tmp/err.txt || {
            echo "::error::failed for a different reason than the removed-keys schema check:"
            cat /tmp/err.txt
            exit 1
          }
          echo "OK: correctly failed on removed prometheus.servicemonitor keys"

      - name: "Fixture — values without removed keys must pass"
        run: |
          set -euo pipefail
          cat > /tmp/good-values.yaml <<'EOF'
          prometheus:
            enabled: true
            servicemonitor:
              enabled: false
          EOF
          helm template test jetstack/cert-manager --version v1.21.1 -f /tmp/good-values.yaml > /tmp/out.yaml
          test -s /tmp/out.yaml
          echo "OK: correctly passed without the removed keys"

      - run: echo "SELF-TEST-COMPLETE"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolver unit tests
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          python3 -m unittest discover -s tests -v
      - run: echo "UNIT-COMPLETE"

  # The argocd-application path through the REAL action.yml (uses: ./),
  # reading a fixture Application from this repo at this commit -- this repo
  # is public, so the fetch runs with the job's own token, same code path as
  # a consumer passing a CICD App token for private argocd-projects.
  argocd-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Provide PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
      - name: Good values
        run: |
          cat > /tmp/good-values.yaml <<'EOF'
          prometheus:
            enabled: true
          EOF

      - name: "Gate version read from the Application must render"
        id: good
        uses: ./
        with:
          chart-repo: https://charts.jetstack.io
          chart-name: cert-manager
          values-file: /tmp/good-values.yaml
          chart-version-file: /nonexistent  # proves the file is NOT read
          argocd-application: tests/fixtures/cert-manager-application.yaml
          github-token: ${{ github.token }}
          argocd-projects-repo: ${{ github.repository }}
          argocd-projects-ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "A chart the Application doesn't pin must fail, not default"
        id: absent
        continue-on-error: true
        uses: ./
        with:
          chart-repo: https://charts.jetstack.io
          chart-name: not-a-pinned-chart
          values-file: /tmp/good-values.yaml
          argocd-application: tests/fixtures/cert-manager-application.yaml
          github-token: ${{ github.token }}
          argocd-projects-repo: ${{ github.repository }}
          argocd-projects-ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert outcomes
        env:
          ABSENT: ${{ steps.absent.outcome }}
          GOOD_VERSION: ${{ steps.good.outputs.chart-version }}
          GOOD_RENDER: ${{ steps.good.outputs.rendered-file }}
        run: |
          set -euo pipefail
          [ "$ABSENT" = failure ] || { echo "::error::unpinned chart did not fail (outcome=$ABSENT)"; exit 1; }
          # The outputs (dvystrcil/longhorn: its render assertions hard-coded
          # 1.12.0 while the cluster ran 1.13.0). A consumer must get the
          # version the ACTION resolved and the file it rendered, not re-derive
          # either. Expected version read from the fixture, not restated.
          want=$(python3 -c "import yaml; d=yaml.safe_load(open('tests/fixtures/cert-manager-application.yaml')); print(next(s['targetRevision'] for s in d['spec']['sources'] if s.get('chart')=='cert-manager'))")
          [ -n "$GOOD_VERSION" ] && [ "$GOOD_VERSION" = "$want" ] || { echo "::error::chart-version output '$GOOD_VERSION', want '$want'"; exit 1; }
          [ -s "$GOOD_RENDER" ] || { echo "::error::rendered-file output '$GOOD_RENDER' is missing or empty"; exit 1; }
          grep -q '^kind: Deployment' "$GOOD_RENDER" || { echo "::error::rendered-file holds no manifests"; exit 1; }
          echo "ARGOCD-APPLICATION-COMPLETE"

  # github-token-file: the path the homelab <repo>-helm-runner sets use.
  token-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Provide PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
      - name: Token files (valid, empty, expired)
        env:
          T: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ok /tmp/empty /tmp/expired
          printf '%s' "$T" > /tmp/ok/token
          date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ > /tmp/ok/expires_at
          : > /tmp/empty/token
          printf '%s' "$T" > /tmp/expired/token
          echo 2026-01-01T00:00:00Z > /tmp/expired/expires_at
          printf 'prometheus:\n  enabled: true\n' > /tmp/good-values.yaml

      - name: "A valid token file reads the Application"
        uses: ./
        with:
          chart-repo: https://charts.jetstack.io
          chart-name: cert-manager
          values-file: /tmp/good-values.yaml
          argocd-application: tests/fixtures/cert-manager-application.yaml
          github-token-file: /tmp/ok/token
          argocd-projects-repo: ${{ github.repository }}
          argocd-projects-ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "An empty token file must fail"
        id: empty
        continue-on-error: true
        uses: ./
        with:
          chart-repo: https://charts.jetstack.io
          chart-name: cert-manager
          values-file: /tmp/good-values.yaml
          argocd-application: tests/fixtures/cert-manager-application.yaml
          github-token-file: /tmp/empty/token
          argocd-projects-repo: ${{ github.repository }}
          argocd-projects-ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "An expired token must fail"
        id: expired
        continue-on-error: true
        uses: ./
        with:
          chart-repo: https://charts.jetstack.io
          chart-name: cert-manager
          values-file: /tmp/good-values.yaml
          argocd-application: tests/fixtures/cert-manager-application.yaml
          github-token-file: /tmp/expired/token
          argocd-projects-repo: ${{ github.repository }}
          argocd-projects-ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert outcomes
        env:
          EMPTY: ${{ steps.empty.outcome }}
          EXPIRED: ${{ steps.expired.outcome }}
        run: |
          set -euo pipefail
          [ "$EMPTY" = failure ] || { echo "::error::empty token file did not fail ($EMPTY)"; exit 1; }
          [ "$EXPIRED" = failure ] || { echo "::error::expired token did not fail ($EXPIRED)"; exit 1; }
          echo "TOKEN-FILE-COMPLETE"

  # The values-landing check through the REAL action.yml (uses: ./), against
  # the chart that motivated it: kube-prometheus-stack, which has no values
  # schema, so helm renders every one of these fixtures cleanly. Only the
  # landing check can tell them apart (dvystrcil/prometheus#66,
  # dvystrcil/homelab#1830 AC2).
  values-landing:
    runs-on: ubuntu-latest
    env:
      CHART_REPO: https://prometheus-community.github.io/helm-charts
      RELOADER: prometheusOperator.prometheusConfigReloader.resources
    steps:
      - uses: actions/checkout@v7
      - name: Provide PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }

      - name: "#66 shape (duplicate keys under the rules map) must fail"
        id: issue66
        continue-on-error: true
        uses: ./
        with:
          chart-repo: ${{ env.CHART_REPO }}
          chart-name: kube-prometheus-stack
          chart-version-file: tests/fixtures/landing/kube-prometheus-stack.version
          values-file: tests/fixtures/landing/issue-66.yaml

      - name: "A block at a path the chart does not read must fail"
        id: wrongpath
        continue-on-error: true
        uses: ./
        with:
          chart-repo: ${{ env.CHART_REPO }}
          chart-name: kube-prometheus-stack
          chart-version-file: tests/fixtures/landing/kube-prometheus-stack.version
          values-file: tests/fixtures/landing/wrong-path.yaml

      - name: "An args-rendered block left undeclared must fail"
        id: undeclared
        continue-on-error: true
        uses: ./
        with:
          chart-repo: ${{ env.CHART_REPO }}
          chart-name: kube-prometheus-stack
          chart-version-file: tests/fixtures/landing/kube-prometheus-stack.version
          values-file: tests/fixtures/landing/correct.yaml

      - name: "Correct paths, args-rendered block declared, must pass"
        uses: ./
        with:
          chart-repo: ${{ env.CHART_REPO }}
          chart-name: kube-prometheus-stack
          chart-version-file: tests/fixtures/landing/kube-prometheus-stack.version
          values-file: tests/fixtures/landing/correct.yaml
          resources-rendered-elsewhere: ${{ env.RELOADER }}

      - name: Assert outcomes
        env:
          ISSUE66: ${{ steps.issue66.outcome }}
          WRONGPATH: ${{ steps.wrongpath.outcome }}
          UNDECLARED: ${{ steps.undeclared.outcome }}
        run: |
          set -euo pipefail
          [ "$ISSUE66" = failure ] || { echo "::error::#66 shape did not fail ($ISSUE66)"; exit 1; }
          [ "$WRONGPATH" = failure ] || { echo "::error::wrong-path block did not fail ($WRONGPATH)"; exit 1; }
          [ "$UNDECLARED" = failure ] || { echo "::error::undeclared args-rendered block did not fail ($UNDECLARED)"; exit 1; }

          # A step outcome of `failure` says nothing about WHY. Prove each one
          # failed for the landing reason, not a render or network error:
          # same chart, same version, same script, asserting the exact finding.
          v=$(cat tests/fixtures/landing/kube-prometheus-stack.version)
          expect() {  # expect <fixture> <text the check must print>
            helm template t kube-prometheus-stack --repo "$CHART_REPO" --version "$v" \
              -f "tests/fixtures/landing/$1.yaml" > "$RUNNER_TEMP/$1.rendered"
            if python3 check-values-landing.py "tests/fixtures/landing/$1.yaml" \
                 "$RUNNER_TEMP/$1.rendered" > "$RUNNER_TEMP/$1.out"; then
              echo "::error::$1 passed the landing check"; exit 1
            fi
            grep -qF "$2" "$RUNNER_TEMP/$1.out" || {
              echo "::error::$1 failed, but not with: $2"; cat "$RUNNER_TEMP/$1.out"; exit 1; }
            echo "OK: $1 -> $2"
          }
          expect issue-66 "duplicate key additionalPrometheusRulesMap.homelab-custom-rules.resources"
          expect wrong-path "prometheus.resources is set in values but not in the render"
          expect correct "$RELOADER is set in values but not in the render"
          echo "VALUES-LANDING-SELFTEST-COMPLETE"
